# docker compose up --build   ->  Web Console + API: http://localhost:8501   OpenAPI Docs: http://localhost:8501/docs
services:
  astrocytex:
    build: .
    command: ["python", "run.py", "ui"]
    env_file:
      - path: .env
        required: false
    environment:
      ASTROGUARD_DB: /app/data/astroguard.db
      ASTROGUARD_CORS: http://localhost:8501,http://localhost:8502
    ports: ["8501:8501"]
    volumes: ["astroguard-data:/app/data"]
  streamlit:
    build: .
    profiles: ["streamlit"]
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.port=8502", "--server.address=0.0.0.0"]
    environment:
      ASTROGUARD_API_URL: http://astrocytex:8501
    ports: ["8502:8502"]
    depends_on: [astrocytex]
volumes:
  astroguard-data:
